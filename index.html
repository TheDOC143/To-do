<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-do</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>To-do</h1>
  <p class="sub" id="sub"></p>
  <form id="f">
    <input type="text" id="in" placeholder="What needs doing?" autocomplete="off" aria-label="New task" maxlength="200">
    <button class="add" type="submit">Add task</button>
  </form>
  <div class="filters" role="group" aria-label="Filter tasks">
    <button data-f="all" aria-pressed="true">All</button>
    <button data-f="active" aria-pressed="false">Active</button>
    <button data-f="done" aria-pressed="false">Done</button>
  </div>
  <ul id="list"></ul>
  <footer><span id="count"></span><button class="clear" id="clear">Clear completed</button></footer>
</main>
<script src="script.js"></script>
</body>
</html>
